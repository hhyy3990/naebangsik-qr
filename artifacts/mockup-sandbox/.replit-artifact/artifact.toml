kind = "design"
previewPath = "/__mockup/"
title = "Mockup Sandbox"
description = "An isolated workspace for previewing extracted app UI and design refinements without changing the live app."
version = "1.0.0"
id = "artifacts/mockup-sandbox"
router = "path"

[[services]]
name = "Component Preview Server"
paths = [ "/__mockup/" ]
localPort = 23636

[services.development]
run = "npm run dev"

[services.env]
PORT = "23636"
BASE_PATH = "/__mockup/"
